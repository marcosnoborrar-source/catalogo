name: Tarea Automatizada de Limpieza de Inventarios

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  limpieza:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Corregido: antes decía python-python-version

    - name: Instalar librerías necesarias
      run: |
        python -m pip install --upgrade pip
        pip install firebase-admin google-api-python-client google-auth-oauthlib google-auth-httplib2

    - name: Ejecutar Script de Supervisión de Inactivos
      env:
        FIREBASE_SECRETS_JSON: ${{ secrets.FIREBASE_SECRETS_JSON }}
        GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      run: python limpiador_inactivos.py
